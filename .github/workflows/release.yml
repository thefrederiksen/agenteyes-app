# Release pipeline (cc-director's model): pushing a v* tag builds every asset,
# generates release-manifest.json (per-asset version/sha256/size), and publishes
# a GitHub Release. The setup wizard/CLI and the in-app updater consume the
# manifest from "latest".
#
# Signing: the four first-party exes are code-signed as "Center Consulting Inc."
# via Azure Trusted Signing (docs/signing.md) BETWEEN publish and manifest, so
# release-manifest.json records the SHA-256 of the SIGNED bytes. Signing is gated
# on `vars.SIGNING_CERT_PROFILE != ''`; with the variable unset the pipeline
# builds an UNSIGNED release with behavior identical to before.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/AgentEyes.App/AgentEyes.App.csproj)).Project.PropertyGroup.Version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) { throw "tag ${{ github.ref_name }} does not match csproj version $version" }

      - name: Run tests
        shell: pwsh
        run: dotnet test tests/AgentEyes.Tests/AgentEyes.Tests.csproj -c Release

      - name: Download ffmpeg (essentials build)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found in the essentials zip" }
          "FFMPEG_DIR=$($bin.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Publish the four first-party exes + the ffmpeg zip into dist/release, but
      # STOP before the manifest (-SkipManifest) so signing can slot in before
      # the assets are hashed.
      - name: Publish release assets (unsigned)
        shell: pwsh
        run: scripts/build-release.ps1 -FfmpegDir $env:FFMPEG_DIR -SkipManifest

      # Sign ONLY the four first-party self-contained exes now in dist/release:
      #   AgentEyesApp-win-x64.exe, agenteyes-win-x64.exe,
      #   agenteyes-setup-cli-win-x64.exe, AgentEyes-Setup-win-x64.exe.
      # filter=exe + the ffmpeg binaries being zipped (not loose exes) means the
      # Gyan ffmpeg.exe/ffprobe.exe are NOT signed, and the Microsoft .NET runtime
      # files are bundled inside the single-file exes, so nothing third-party is
      # signed. No-op until the repo has SIGNING_CERT_PROFILE + the AZURE_* secrets.
      - name: Sign first-party exes (Azure Trusted Signing)
        if: ${{ vars.SIGNING_CERT_PROFILE != '' }}
        uses: ./.github/actions/sign-windows
        with:
          folder: dist/release
          filter: exe
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE }}

      # Hash the assets AS THEY NOW SIT (signed, if the step above ran) into
      # release-manifest.json - the sha256 the setup engine verifies at install.
      - name: Write release manifest (hashes signed binaries)
        shell: pwsh
        run: scripts/write-manifest.ps1

      - name: Verify completeness
        shell: pwsh
        run: |
          $required = @(
            'AgentEyesApp-win-x64.exe',
            'agenteyes-win-x64.exe',
            'agenteyes-setup-cli-win-x64.exe',
            'AgentEyes-Setup-win-x64.exe',
            'agenteyes-ffmpeg-win-x64.zip',
            'release-manifest.json'
          )
          $missing = $required | Where-Object { -not (Test-Path "dist/release/$_") }
          if ($missing) { throw "missing release assets: $($missing -join ', ')" }
          Get-ChildItem dist/release

      - name: Smoke-test an offline install from the built release
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/agenteyes-install-test"
          dist/release/agenteyes-setup-cli-win-x64.exe install --release-dir dist/release --root $root --no-finalize --json
          if ($LASTEXITCODE -ne 0) { throw "offline install smoke test failed" }
          if (-not (Test-Path "$root/app/AgentEyesApp.exe")) { throw "app exe missing after install" }
          if (-not (Test-Path "$root/app/ffmpeg.exe")) { throw "bundled ffmpeg missing after install" }

      # THE ONE PUBLISH. This workflow has exactly one command that creates or changes
      # a release anywhere, and it is this one: an OWN-REPO `gh release create` with the
      # built-in GITHUB_TOKEN. There is no cross-repo write left in the file, which is
      # why no secret has to exist in whichever repo runs it (issue #184).
      #
      # THE RELEASE IS CUT FROM THE REPO WHOSE SOURCE IS BEING BUILT.
      # The source is public now, so development and releases live in ONE repo
      # (thefrederiksen/agenteyes-app - the value ReleaseSource.Repo reads), and this
      # step publishes to ${{ github.repository }}: the very repo this workflow run
      # checked out and built. The installer users download is served straight off it:
      #   https://github.com/thefrederiksen/agenteyes-app/releases/latest/download/AgentEyes-Setup-win-x64.exe
      # That URL 404s until the FIRST release is cut from agenteyes-app; verify it right
      # after that cut, not before.
      #
      # That is a STRUCTURAL fix, not a guard. `gh release create --repo <other-repo>`
      # MATERIALISES THE TAG FROM THAT REPO'S DEFAULT BRANCH when the tag does not
      # already exist there - so a cross-repo release publish attaches these binaries
      # to a tag cut from SOMEONE ELSE'S source, and GitHub's generated source archives
      # for the release then contain code that never produced them. gh reports success
      # either way, which makes it silent. There is no cross-repo release publish here
      # to get that wrong: the tag being published is the tag that triggered this run,
      # in this repo, at this commit.
      #
      # No secret: the built-in GITHUB_TOKEN writes THIS repo's releases under the
      # `permissions: contents: write` granted at the top of the file.
      #
      # --verify-tag: the tag is what triggered the run, so it always exists; the flag
      # is a cheap assertion that this stays an own-repo publish of an existing tag and
      # can never quietly create one.
      #
      # A pre-release tag (one containing '-', e.g. v1.0.0-rc.1) publishes with
      # --prerelease AND --latest=false, so GitHub's /releases/latest (which the in-app
      # updater reads via ReleaseSource.FetchLatestAsync) does NOT resolve to it and
      # stable installs never see it. A full-release tag (no '-') keeps today's exact
      # command: $prerelease is empty, the splat contributes nothing, so no --prerelease
      # is passed and the release becomes the repo's Latest as before.
      #
      # The assets are NAMED, not swept up with a wildcard, and the step fails unless
      # dist/release holds exactly that set - so a missing or unexpected artifact stops
      # the publish instead of shipping a half-release.
      #
      # NO TEST GUARDS WHERE THIS PUBLISHES. Rounds 2 and 3 of issue #184 tried to; the
      # classifier was deleted in round 4 after QA drove five separate evasions through
      # it. What keeps the publish honest is structural: the retired repositories are
      # being deleted, so a cross-repo publish 404s loudly at the moment it runs.
      # UpdateChannelTests only scans the files under .github for two literal retired
      # names, and says so in its own comments.
      - name: Publish release to this repo's own releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            'dist/release/AgentEyesApp-win-x64.exe',
            'dist/release/agenteyes-win-x64.exe',
            'dist/release/agenteyes-setup-cli-win-x64.exe',
            'dist/release/AgentEyes-Setup-win-x64.exe',
            'dist/release/agenteyes-ffmpeg-win-x64.zip',
            'dist/release/release-manifest.json'
          )
          $onDisk = @(Get-ChildItem dist/release | ForEach-Object { 'dist/release/' + $_.Name })
          $difference = Compare-Object -ReferenceObject $assets -DifferenceObject $onDisk
          if ($difference) { throw "dist/release is not exactly the asset set this step publishes: $($difference | Out-String)" }
          $prerelease = @()
          if ("${{ github.ref_name }}" -like '*-*') { $prerelease = @('--prerelease', '--latest=false') }
          gh release create "${{ github.ref_name }}" @assets `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --title "AgentEyes ${{ github.ref_name }}" `
            --notes "AgentEyes ${{ github.ref_name }}. Download AgentEyes-Setup-win-x64.exe and run it." `
            @prerelease
          if ($LASTEXITCODE -ne 0) { throw "publish to this repo's own releases failed" }

      # NOTHING FOLLOWS. The DevThrottle mirror step that used to sit here - it copied
      # AgentEyes-Setup-win-x64.exe into thefrederiksen/devthrottle under the fixed tag
      # agenteyes-latest so the website had a stable anonymous download - was DELETED in
      # issue #184. agenteyes-app is public, so GitHub already serves that stable URL
      # directly off the release published above:
      #   https://github.com/thefrederiksen/agenteyes-app/releases/latest/download/AgentEyes-Setup-win-x64.exe
      # Deleting the mirror removed this workflow's only cross-repo write, and with it the
      # cross-repo token that write needed: nothing left in this file requires a secret
      # that GitHub does not supply by itself. (UpdateChannelTests runs a LITERAL STRING
      # SCAN over every file under .github for that token's name and for the retired
      # release repo's name; that scan is text only and claims nothing about behaviour,
      # which is why neither name is spelled out here.)
      # (Deleting the step does not delete the old devthrottle release - that one simply
      # goes stale. No product, script or page reads it.)
