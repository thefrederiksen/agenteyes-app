# CI (issue #102): proves both builds on every pull request and branch push.
#   windows - the existing agent gate: build + test AgentEyes.sln (Release), which builds the desktop
#             app (src/AgentEyes.DesktopApp) since issue #116.
#   linux   - the Linux build of AgentEyes.Core (net8.0) and its tests (tests/AgentEyes.Tests.Linux).
#   macos   - the macOS build of AgentEyes.Core and its tests (tests/AgentEyes.Tests.Mac).
# Issue #116: each job also builds the desktop app for its own platform and proves the app links that
# platform's engine (string checks over the engine assembly in the app's own output folder).
# Releases are still built only by release.yml on a v* tag.
name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #173: committed evidence must not carry an email address. The repository is public and
  # proof files are copied between seats, so one leak became 84 files. The check matches the SHAPE
  # of an address or a named home path and never names one (scripts/check-proof-identity.py says
  # why, lists its allowances, and states what its line-wrap rule misses and flags; the corpus in
  # tests/evidence-identity-corpus/ pins both). It stops the NEXT leak; git history keeps the last.
  evidence-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guard is made to fire on every run before its silence is believed: plant each shape it
      # claims to see in a new proof file - an address, a named home path, and BOTH broken across a
      # line break the way a console wraps them (#173 QA: a wrapped home path got past every
      # line-by-line search) - and require a red result that names that file and line for each.
      # The planted values are assembled at run time so this workflow holds no such literal.
      - name: Positive control - the guard must fail on each planted shape, wrapped or not
        shell: bash
        run: |
          probe=docs/cencon/proof/ci-identity-probe.txt
          check() {
            local what=$1 want=$2
            set +e
            out=$(python3 scripts/check-proof-identity.py)
            code=$?
            set -e
            rm -f "$probe"
            echo "$out"
            test $code -eq 1 || { echo "[FAIL] the guard exited $code on a planted $what; expected 1 - it cannot fail, so its green means nothing"; exit 1; }
            echo "$out" | grep -q "ci-identity-probe.txt:$want" || { echo "[FAIL] the guard went red on a planted $what but did not name ci-identity-probe.txt:$want"; exit 1; }
            echo "[OK] the guard fails on a planted $what and names the file and line"
          }
          printf 'signed in as %s@%s\n' planted.probe acme-widgets.io > "$probe"
          check address "1:"
          printf 'line one\nsigned in as planted.probe@acme-wid\ngets.%s\n' io > "$probe"
          check "address wrapped across a line" "2: WRAPPED"
          printf 'output to %s:\\%s\\%s\\Videos\n' C Users planted-probe > "$probe"
          check "home path" "1:"
          printf 'line one\nCannot remove C:\\Us\r\ners\\%s\\AppData\\Local\n' planted-probe > "$probe"
          check "home path wrapped across a CRLF line break" "2: WRAPPED"
          python3 scripts/check-proof-identity.py || { echo "[FAIL] the guard is still red with every probe removed"; exit 1; }

      # ...and made to stay QUIET on an ordinary file. A guard that joins every line break reads
      # "import pytest" + a decorator line as an address (#173 QA round 2), and the first person to
      # commit such a file would be blocked. Plant one in the real tree and require green, then run
      # the committed corpus: identity-free files that must stay green, every leak shape (wrapped,
      # padded, lone CR, UTF-16) that must go red, and the declared misses and flags pinned both ways.
      - name: Negative control - the guard must stay green on identity-free files, and the corpus must hold
        shell: bash
        run: |
          probe=docs/cencon/proof/ci-identity-probe.py
          printf 'import pytest\n%spytest.mark.parametrize("x", [1])\ndef test_x(x):\n    pass\n' '@' > "$probe"
          set +e
          out=$(python3 scripts/check-proof-identity.py)
          code=$?
          set -e
          rm -f "$probe"
          echo "$out"
          test $code -eq 0 || { echo "[FAIL] the guard exited $code on an identity-free pytest file; expected 0 - it would block an ordinary commit"; exit 1; }
          echo "[OK] the guard stays green on an identity-free pytest decorator file"
          python3 scripts/test-check-proof-identity.py

      - name: No email address and no named home path in committed evidence
        run: python3 scripts/check-proof-identity.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download ffmpeg (essentials build)
        # The suite exercises the real encoder (see release.yml); the opted-in pass below needs it most.
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $bin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg.exe not found in the essentials zip" }
          "QA_RECORD_FFMPEG_DIR=$($bin.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build AgentEyes.sln
        run: dotnet build AgentEyes.sln -c Release

      - name: Test AgentEyes.sln
        run: dotnet test AgentEyes.sln -c Release --no-build

      # Issue #116: the desktop app must link the engine's WINDOWS target. Its net8.0 target is the
      # Unix engine (x11grab, PulseAudio), and a Windows app that picked it up would build and then
      # record nothing. Checked over the engine assembly in the APP's output, the copy the app loads.
      # gdigrab alone does not decide it (the shared recorder code names gdigrab in every build); the
      # NAudio assembly reference does - only the Windows engine has it.
      - name: The Windows desktop app must link the Windows engine
        shell: bash
        run: |
          out=src/AgentEyes.DesktopApp/bin/x64/Release/net8.0-windows10.0.19041.0
          dll=$out/agenteyes.dll
          test -f "$out/AgentEyesDesktop.exe" || { echo "[FAIL] $out/AgentEyesDesktop.exe was not built"; exit 1; }
          test -f "$dll" || { echo "[FAIL] $dll was not built"; exit 1; }
          test -f "$out/libvlc/win-x64/libvlc.dll" || { echo "[FAIL] libvlc.dll (VideoLAN.LibVLC.Windows) is missing from $out"; exit 1; }
          fail=0
          for word in x11grab pulse v4l2 avfoundation; do
            if python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('$word'.encode('utf-16-le')) else 1)"; then
              echo "[FAIL] the Windows app's engine contains '$word'"; fail=1
            fi
          done
          python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('gdigrab'.encode('utf-16-le')) else 1)" \
            || { echo "[FAIL] the Windows app's engine does NOT contain 'gdigrab'"; fail=1; }
          python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count(b'NAudio') else 1)" \
            || { echo "[FAIL] the Windows app's engine has no NAudio reference - it is not the Windows engine"; fail=1; }
          test $fail -eq 0 && echo "[OK] the Windows desktop app links the Windows engine (gdigrab, NAudio; no x11grab/pulse/v4l2/avfoundation)"
          exit $fail

      # Issue #151: the tests that launch a real ffmpeg are opt-in, so the gate an agent runs after
      # every change stays fast. They are NOT optional here: this second pass sets the opt-in and
      # runs the whole suite again, so every opt-in test (the #128 mic-chain guards among them) still
      # runs on every push. A guard behind a flag nobody sets would be a deleted guard.
      - name: Test AgentEyes.sln with the ffmpeg-backed tests (AGENTEYES_FFMPEG_TESTS=1)
        env:
          AGENTEYES_FFMPEG_TESTS: "1"
        run: dotnet test AgentEyes.sln -c Release --no-build

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build AgentEyes.Core (net8.0)
        run: dotnet build src/AgentEyes.Core/AgentEyes.Core.csproj -c Release -f net8.0

      - name: Test the Linux build
        run: dotnet test tests/AgentEyes.Tests.Linux/AgentEyes.Tests.Linux.csproj -c Release

      # Issue #116: the desktop app for Linux, and proof it links the Linux engine.
      - name: Build the desktop app (Linux)
        run: dotnet build src/AgentEyes.DesktopApp/AgentEyes.DesktopApp.csproj -c Release

      - name: The Linux desktop app must link the Linux engine
        shell: bash
        run: |
          dll=src/AgentEyes.DesktopApp/bin/Release/net8.0/agenteyes.dll
          test -f src/AgentEyes.DesktopApp/bin/Release/net8.0/AgentEyesDesktop || { echo "[FAIL] AgentEyesDesktop was not built"; exit 1; }
          test -f "$dll" || { echo "[FAIL] $dll was not built"; exit 1; }
          fail=0
          for word in x11grab pulse; do
            if ! python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('$word'.encode('utf-16-le')) else 1)"; then
              echo "[FAIL] the Linux app's engine does NOT contain '$word'"; fail=1
            fi
          done
          if python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('avfoundation'.encode('utf-16-le')) or d.count(b'NAudio') else 1)"; then
            echo "[FAIL] the Linux app's engine carries macOS or Windows capture code"; fail=1
          fi
          test $fail -eq 0 && echo "[OK] the Linux desktop app links the Linux engine (x11grab, pulse; no avfoundation, no NAudio)"
          exit $fail

      # Issue #151: the opt-in tests that launch a real ffmpeg - among them the proof that a test's
      # failure path kills only the ffmpeg it started and leaves an unrelated one running.
      - name: Install ffmpeg
        run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: Test the Linux build with the ffmpeg-backed tests (AGENTEYES_FFMPEG_TESTS=1)
        env:
          AGENTEYES_FFMPEG_TESTS: "1"
        run: dotnet test tests/AgentEyes.Tests.Linux/AgentEyes.Tests.Linux.csproj -c Release --no-build

      # Issue #194: the Linux release asset is built on every push, so a change that breaks it fails
      # here and not at tag time (release.yml builds it again and installs it in a clean container).
      - name: Build the Linux release assets
        run: scripts/linux/build-release.sh dist/linux

      # The Linux job also builds the macOS configuration, because the thing most likely to break it
      # is a change made on Linux that forgets the third platform exists. This is a COMPILE check
      # only - it proves the macOS engine still builds, not that it records.
      - name: Build the macOS configuration (compile check)
        run: dotnet build src/AgentEyes.Core/AgentEyes.Core.csproj -c Release -f net8.0 -p:AgentEyesUnixPlatform=mac

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build AgentEyes.Core (net8.0, macOS configuration)
        run: dotnet build src/AgentEyes.Core/AgentEyes.Core.csproj -c Release -f net8.0

      # Every test in this suite is pure logic - argument lists, parsers, arithmetic. None of them
      # captures a screen or opens a microphone, which is why they can run on a hosted runner that
      # has neither a granted Screen Recording permission nor any audio device.
      # AGENTEYES_REAL_CLI_TESTS=1 (issue #156 pass 4): also run the test that drives the real
      # agenteyes CLI under sandbox-exec. It is opt-in because on a person's Mac it writes their real
      # AgentEyes log (#161); a hosted runner has none to protect.
      - name: Test the macOS build
        env:
          AGENTEYES_REAL_CLI_TESTS: "1"
        run: dotnet test tests/AgentEyes.Tests.Mac/AgentEyes.Tests.Mac.csproj -c Release

      # The macOS build must not contain the Linux capture backend. This is the regression that
      # started the whole piece of work: "not Windows" was read as "Linux", so a Mac build compiled
      # x11grab and PulseAudio and then asked the user to run systemctl.
      - name: The macOS build must carry no Linux capture code
        shell: bash
        run: |
          dll=src/AgentEyes.Core/bin/Release/net8.0/agenteyes.dll
          test -f "$dll" || { echo "[FAIL] $dll was not built"; exit 1; }
          # The literals are UTF-16 in a .NET assembly, so grep for the encoded form.
          fail=0
          for word in x11grab pulse v4l2 xrandr; do
            if python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('$word'.encode('utf-16-le')) else 1)"; then
              echo "[FAIL] the macOS build contains '$word'"
              fail=1
            fi
          done
          # And the inverse, so this check cannot pass by finding nothing at all (an absent
          # assembly, a renamed path): what SHOULD be there must be there.
          for word in avfoundation screencapture; do
            if ! python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('$word'.encode('utf-16-le')) else 1)"; then
              echo "[FAIL] the macOS build does NOT contain '$word' - this check is not looking at a real macOS build"
              fail=1
            fi
          done
          test $fail -eq 0 && echo "[OK] macOS build carries AVFoundation and no Linux capture code"
          exit $fail

      # Issue #116: the desktop app for macOS - it builds, carries the libvlc natives its player needs
      # (without them it throws before any window opens), and its engine is the macOS one.
      - name: Build the desktop app (macOS)
        run: dotnet build src/AgentEyes.DesktopApp/AgentEyes.DesktopApp.csproj -c Release

      - name: The macOS desktop app must link the macOS engine and carry libvlc
        shell: bash
        run: |
          out=src/AgentEyes.DesktopApp/bin/Release/net8.0
          dll=$out/agenteyes.dll
          test -f "$out/AgentEyesDesktop.dll" || { echo "[FAIL] AgentEyesDesktop was not built"; exit 1; }
          test -f "$dll" || { echo "[FAIL] $dll was not built"; exit 1; }
          ls "$out"/libvlc/osx-*/lib/libvlc.dylib >/dev/null 2>&1 || { echo "[FAIL] libvlc.dylib (VideoLAN.LibVLC.Mac) is missing from $out"; exit 1; }
          fail=0
          for word in x11grab pulse v4l2 xrandr; do
            if python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('$word'.encode('utf-16-le')) else 1)"; then
              echo "[FAIL] the macOS app's engine contains '$word'"; fail=1
            fi
          done
          python3 -c "import sys;d=open('$dll','rb').read();sys.exit(0 if d.count('avfoundation'.encode('utf-16-le')) else 1)" \
            || { echo "[FAIL] the macOS app's engine does NOT contain 'avfoundation'"; fail=1; }
          test $fail -eq 0 && echo "[OK] the macOS desktop app links the macOS engine and carries libvlc"
          exit $fail

      # Issue #118: AgentEyes.app - the self-contained, ad-hoc signed bundle builds from a clean checkout
      # with the documented script, carries the permanent bundle identifier, and its signature verifies.
      # It is not launched here: a hosted runner has no logged-in user to show a window to.
      - name: Build AgentEyes.app (macOS bundle)
        shell: bash
        run: |
          out="$RUNNER_TEMP/bundle"
          mkdir -p "$out"
          scripts/mac/build-app.sh "$out"
          app="$out/AgentEyes.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.agenteyes.app" \
            || { echo "[FAIL] CFBundleIdentifier is not com.agenteyes.app"; exit 1; }
          test -x "$app/Contents/MacOS/AgentEyesDesktop" || { echo "[FAIL] the bundle has no AgentEyesDesktop"; exit 1; }
          test -f "$app/Contents/MacOS/libhostfxr.dylib" || { echo "[FAIL] the bundle is not self-contained: no libhostfxr.dylib"; exit 1; }
          ls "$app"/Contents/MacOS/libvlc/osx-*/lib/libvlc.dylib >/dev/null 2>&1 || { echo "[FAIL] the bundle carries no libvlc"; exit 1; }
          codesign --verify --deep --strict "$app" || { echo "[FAIL] the bundle's signature does not verify"; exit 1; }
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)='
          du -sh "$app"
          echo "[OK] AgentEyes.app built, self-contained, ad-hoc signed and verified (NOT notarised)"
